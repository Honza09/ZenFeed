name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check backend
      - name: Tests (pytest)
        run: pytest backend

  extension:
    name: Extension (manifest + JS syntax)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate manifest
        run: python .github/scripts/check_extension.py extension/manifest.json
      - name: Check JavaScript syntax
        run: find extension -name '*.js' -print0 | xargs -0 -r -n1 node --check
